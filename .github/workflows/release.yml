name: Release

# Trigger on version tags (e.g. v0.1.1) or manual dispatch for testing
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Required for electron-builder to create and upload GitHub Releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build & publish Windows installer
        run: npm run typecheck && npm run prepare:uv && npm run build:vite && npx electron-builder --win --publish always
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build & publish macOS DMG
        run: npm run typecheck && npm run prepare:uv && npm run build:vite && npx electron-builder --mac --publish always
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build & publish Linux AppImage + deb
        run: npm run typecheck && npm run prepare:uv && npm run build:vite && npx electron-builder --linux --publish always
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
