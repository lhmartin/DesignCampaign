name: Release

# Trigger on version tags (e.g. v0.1.1) or manual dispatch for testing
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Required for electron-builder to create and upload GitHub Releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build Windows installer
        run: npm run build:win
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build macOS DMG
        run: npm run build:mac
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: designcampaign-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: designcampaign-web

      - name: Build Linux AppImage + deb
        run: npm run build:linux
        working-directory: designcampaign-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
