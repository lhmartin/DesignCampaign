<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark navy rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="#040812"/>

  <!-- α-helix silhouette: two ribbon arcs coiling around each other -->
  <!-- Cobalt blue ribbon arc (front) -->
  <path
    d="M 140 340
       C 140 280, 200 260, 256 256
       C 312 252, 372 232, 372 172"
    fill="none"
    stroke="#3b82f6"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Teal ribbon arc (back, offset) -->
  <path
    d="M 172 364
       C 172 300, 232 276, 256 256
       C 280 236, 340 212, 340 148"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <!-- Cross-strand connector dots to suggest helix turns -->
  <circle cx="192" cy="330" r="14" fill="#3b82f6"/>
  <circle cx="320" cy="182" r="14" fill="#2dd4bf" opacity="0.85"/>
</svg>
