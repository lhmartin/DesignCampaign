<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesignCampaign</title>
    <!-- Prevent flash: set dark class before React hydrates -->
    <script>
      (function() {
        // Polyfill Node.js `global` for CJS packages (e.g. plotly.js) bundled by Vite
        if (typeof window.global === 'undefined') window.global = globalThis;
        var stored = localStorage.getItem('theme');
        if (stored !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Fonts: Outfit (UI) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
